<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 800" width="1600" height="800">
  <defs>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1600" height="800" fill="#F5F1E8"/>

  <!-- ================================
       NODE 1: WhatsApp — upper left
       ================================ -->
  <g transform="translate(118, 108)">
    <rect width="216" height="116" rx="12" fill="#F9F9F9" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Icon: speech bubble with message dots — 28×28 at x=94, y=13 -->
    <g transform="translate(94, 13)" fill="none" stroke="#5A8B6F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3,2 L25,2 Q26,2 26,3 L26,17 Q26,18 25,18 L16,18 L14,22 L12,18 L3,18 Q2,18 2,17 L2,3 Q2,2 3,2 Z"/>
      <circle cx="9"  cy="10" r="1.5" fill="#5A8B6F" stroke="none"/>
      <circle cx="14" cy="10" r="1.5" fill="#5A8B6F" stroke="none"/>
      <circle cx="19" cy="10" r="1.5" fill="#5A8B6F" stroke="none"/>
    </g>
    <text x="108" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">WhatsApp</text>
    <text x="108" y="78" text-anchor="middle" font-size="11" fill="#6B7280">Customer communication,</text>
    <text x="108" y="93" text-anchor="middle" font-size="11" fill="#6B7280">orders, billing</text>
  </g>

  <!-- ================================
       NODE 2: YouTube — upper right
       ================================ -->
  <g transform="translate(1242, 62)">
    <rect width="206" height="116" rx="12" fill="#F9F9F9" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Icon: play button in rounded rectangle — 28×28 at x=89, y=13 -->
    <g transform="translate(89, 13)" fill="none" stroke="#5A8B6F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="1" y="4" width="26" height="20" rx="4"/>
      <polygon points="11,10 11,20 21,15" fill="#5A8B6F" stroke="none"/>
    </g>
    <text x="103" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">YouTube</text>
    <text x="103" y="78" text-anchor="middle" font-size="11" fill="#6B7280">Learning, tutorials,</text>
    <text x="103" y="93" text-anchor="middle" font-size="11" fill="#6B7280">inspiration</text>
  </g>

  <!-- ================================
       NODE 3: Notebook — center
       ================================ -->
  <g transform="translate(673, 340)">
    <rect width="230" height="116" rx="12" fill="#F9F9F9" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Icon: lined notebook — 28×28 at x=101, y=13 -->
    <g transform="translate(101, 13)" fill="none" stroke="#5A8B6F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="1" width="24" height="26" rx="2"/>
      <line x1="8"  y1="1"  x2="8"  y2="27"/>
      <line x1="13" y1="9"  x2="23" y2="9"/>
      <line x1="13" y1="14" x2="23" y2="14"/>
      <line x1="13" y1="19" x2="20" y2="19"/>
    </g>
    <text x="115" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">Notebook</text>
    <text x="115" y="78" text-anchor="middle" font-size="11" fill="#6B7280">Task tracking,</text>
    <text x="115" y="93" text-anchor="middle" font-size="11" fill="#6B7280">order management</text>
  </g>

  <!-- ================================
       NODE 4: Personal Contacts — lower left
       ================================ -->
  <g transform="translate(152, 498)">
    <rect width="224" height="116" rx="12" fill="#F9F9F9" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Icon: person silhouette — 28×28 at x=98, y=13 -->
    <g transform="translate(98, 13)" fill="none" stroke="#5A8B6F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="14" cy="9" r="7"/>
      <path d="M2,27 Q2,19 14,19 Q26,19 26,27"/>
    </g>
    <text x="112" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">Personal Contacts</text>
    <text x="112" y="78" text-anchor="middle" font-size="11" fill="#6B7280">Vendors, customers,</text>
    <text x="112" y="93" text-anchor="middle" font-size="11" fill="#6B7280">referrals</text>
  </g>

  <!-- ================================
       NODE 5: Word of Mouth — lower right
       ================================ -->
  <g transform="translate(1198, 492)">
    <rect width="218" height="116" rx="12" fill="#F9F9F9" stroke="#E5E7EB" stroke-width="1"/>
    <!-- Icon: two overlapping speech bubbles — 28×28 at x=95, y=13 -->
    <g transform="translate(95, 13)" fill="none" stroke="#5A8B6F" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <!-- Front bubble (left) -->
      <path d="M1,1 L14,1 Q16,1 16,3 L16,11 Q16,13 14,13 L10,13 L9,17 L8,13 L2,13 Q1,13 1,11 L1,3 Q1,1 2,1 Z"/>
      <!-- Back bubble (right) -->
      <path d="M11,8 L26,8 Q27,8 27,10 L27,19 Q27,21 26,21 L20,21 L19,25 L18,21 L12,21 Q11,21 11,19 L11,10 Q11,8 12,8 Z"/>
    </g>
    <text x="109" y="60" text-anchor="middle" font-size="15" font-weight="700" fill="#1A1A1A">Word of Mouth</text>
    <text x="109" y="78" text-anchor="middle" font-size="11" fill="#6B7280">Introductions, reputation,</text>
    <text x="109" y="93" text-anchor="middle" font-size="11" fill="#6B7280">discovery</text>
  </g>

</svg>
